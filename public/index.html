<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Circle Feed</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        color: #8b949e;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.4rem;
        border: 1px solid #30363d;
        border-radius: 999px;
        color: #58a6ff;
        text-decoration: none;
        font-size: 0.9rem;
        transition: border-color 0.2s;
      }
      a:hover {
        border-color: #58a6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Circle Feed</h1>
      <p>这是一个圈子数据源，只对外提供 JSON 接口。</p>
      <a href="/circle.json">查看 /circle.json</a>
    </main>
  </body>
</html>
