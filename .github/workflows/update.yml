name: Update and Deploy

# 抓取友链 RSS 生成 circle.json，并部署到 GitHub Pages
# 部署产物只有 public/ 目录（即 circle.json），源码不会暴露
on:
  schedule:
    # UTC 每 6 小时的第 23 分钟
    # 对应北京时间 02:23 / 08:23 / 14:23 / 20:23
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # 配置或脚本变动时立即刷新一次
      - 'src/config.ts'
      - 'scripts/fetch-circle.mjs'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: circle-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout 后立刻对齐远端最新，避免任务运行期间远端有新提交时基于旧快照生成
      - name: Sync with remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 脚本为零依赖纯 Node 实现，无需安装任何包
      - name: Fetch feeds
        run: node scripts/fetch-circle.mjs
        env:
          TZ: Asia/Shanghai

      - name: Show summary
        run: |
          echo "订阅源：$(node -p "require('./public/circle.json').sourceCount")"
          echo "文章数：$(node -p "require('./public/circle.json').items.length")"
          echo "失败数：$(node -p "require('./public/circle.json').failures.length")"

      # 提交回仓库只是为了留一份数据历史，失败不影响部署
      - name: Commit data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/circle.json

          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: 更新圈子数据 $(date '+%Y-%m-%d %H:%M')"

          # 推送失败时同步远端并重试，最多三次
          for i in 1 2 3; do
            if git push origin main; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败，同步远端后重试…"
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            sleep 5
          done
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只上传 public/ 目录，其中 CNAME 文件用于保留自定义域名
      # 注意：Settings 里填域名生成的 CNAME 在仓库根目录，不会进入部署产物，
      #       因此必须放在 public/ 下，否则每次部署后自定义域名会失效
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
